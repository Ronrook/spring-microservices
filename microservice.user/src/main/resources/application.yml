
server:
  port: 8081

spring:
  application:
    name: user-service
  config:
    import: optional:classpath:env.properties

  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_DATABASE}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: public
    open-in-view: false

  sql:
    init:
      mode: always
      separator: "//"
      schema-locations: classpath:sql/schema.sql
      data-locations: classpath:sql/data.sql

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

cors:
  allowed-origins: "http://localhost:4200"

logging:
  level:
    root: INFO
    com.microservice.user: DEBUG
    org.springframework.security: INFO
    AUDIT: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [requestId=%X{requestId}, clientIp=%X{clientIp}] - %msg%n"

jwt:
  secret-key: ${JWT_SECRET_KEY}
  expiration-time: ${JWT_EXPIRATION_TIME}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /docs
